<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>remote-luffy</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;font-family:system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh}
#stage{flex:1;min-height:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#screen{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
#bar{display:flex;gap:6px;padding:6px;background:#1c1c1c;overflow-x:auto;flex:none}
#bar button,#clip button{flex:none;padding:10px 12px;font-size:15px;border:0;border-radius:8px;background:#333;color:#eee}
#bar button.on{background:#4f8cff}
#padwrap{flex:none;display:none;flex-direction:column;background:#101010;border-top:1px solid #333}
#padwrap.show{display:flex}
#padbtns{display:flex;gap:6px;padding:6px}
#padbtns button{flex:1;padding:10px 4px;font-size:15px;border:0;border-radius:8px;background:#333;color:#eee}
#padbtns button.on{background:#4f8cff}
#pad{height:30vh;margin:0 6px 6px;border-radius:10px;background:#1a1a1a;touch-action:none;-webkit-user-select:none;user-select:none;color:#555;display:flex;align-items:center;justify-content:center;font-size:14px}
#clip{display:none;padding:6px;background:#1c1c1c;gap:6px;flex-wrap:wrap}
#clip.show{display:flex}
#clip textarea{flex:1 1 100%;height:90px;font-size:16px;border-radius:8px;border:0;padding:8px;box-sizing:border-box}
#pop{position:fixed;display:none;grid-template-columns:repeat(2,1fr);gap:6px;padding:8px;background:#222;border-radius:12px;box-shadow:0 4px 20px #000a;z-index:10;width:230px}
#pop button{padding:12px 6px;font-size:15px;border:0;border-radius:8px;background:#3a3a3a;color:#eee}
#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0}
#toast{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 12px;border-radius:8px;font-size:14px;display:none;max-width:90vw}
</style></head><body>
<div id="app">
  <div id="stage"><img id="screen" src="/stream" alt="layar"></div>
  <div id="padwrap" class="show">
    <div id="padbtns"><button id="pL">Klik kiri</button><button id="pR">Klik kanan</button><button id="pDrag">Tahan (drag)</button></div>
    <div id="pad">Touchpad: geser = gerak, ketuk = klik, 2 jari ketuk = klik kanan, 2 jari geser = scroll</div>
  </div>
  <div id="clip">
    <textarea id="cliptext" placeholder="Teks untuk dikirim ke laptop / hasil clipboard laptop"></textarea>
    <button id="cPaste">Kirim &amp; tempel</button>
    <button id="cPasteT">Tempel (terminal)</button>
    <button id="cSet">Ke clipboard laptop</button>
    <button id="cGet">Ambil dari laptop</button>
    <button id="cCopy">Salin ke HP</button>
  </div>
  <div id="bar">
    <button id="bKb">⌨</button><button id="bPad" class="on">🖱</button><button id="bClip">📋</button>
    <button data-mod="ctrl">Ctrl</button><button data-mod="alt">Alt</button><button data-mod="shift">Shift</button><button data-mod="super">Super</button>
    <button data-combo="ctrl+c">Copy</button><button data-combo="ctrl+v">Paste</button><button data-combo="ctrl+x">Cut</button>
    <button data-combo="ctrl+a">All</button><button data-combo="ctrl+z">Undo</button>
    <button data-key="esc">Esc</button><button data-key="tab">Tab</button><button data-key="enter">Enter</button><button data-key="backspace">⌫</button><button data-key="delete">Del</button>
    <button data-key="left">←</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="right">→</button>
    <button data-key="home">Home</button><button data-key="end">End</button><button data-key="pageup">PgUp</button><button data-key="pagedown">PgDn</button>
  </div>
</div>
<div id="pop">
  <button data-combo="ctrl+c">Copy</button><button data-combo="ctrl+v">Paste</button>
  <button data-combo="ctrl+x">Cut</button><button data-combo="ctrl+a">Select all</button>
  <button data-combo="ctrl+z">Undo</button><button data-combo="ctrl+shift+v">Paste terminal</button>
  <button id="pGet">Clipboard laptop → HP</button><button id="pSend">Kirim teks HP → laptop</button>
</div>
<input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),img=$('#screen'),stage=$('#stage'),kb=$('#kb');
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3500)}

async function api(path,body){
  try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{}),keepalive:true});
    if(r.status===401){location='/login';return}
    const j=await r.json();if(!r.ok)toast(j.error||('Error '+r.status));return j}
  catch(e){toast('Gagal terhubung ke server')}
}
// Semua aksi lewat satu antrean agar urutan (down, move, up) terjaga; move digabung.
let q=Promise.resolve(),pend=null;
function enq(path,body){q=q.then(()=>api(path,body))}
function move(p){if(pend){pend.p=p;return}const o=pend={p};q=q.then(()=>{pend=null;return api('/api/move',o.p)})}

function frac(t){
  const W=img.clientWidth,H=img.clientHeight,iw=img.naturalWidth||16,ih=img.naturalHeight||9,s=Math.min(W/iw,H/ih),w=iw*s,h=ih*s,r=img.getBoundingClientRect(),l=r.left+(W-w)/2,tp=r.top+(H-h)/2;
  return{x:Math.min(1,Math.max(0,(t.clientX-l)/w)),y:Math.min(1,Math.max(0,(t.clientY-tp)/h))}
}
// Gestur: ketuk=klik, tahan=klik kanan, geser 1 jari=drag, geser 2 jari=scroll
let st=null,swallow=false;const pop=$('#pop');
function showPop(x,y){pop.style.display='grid';const w=pop.offsetWidth,h=pop.offsetHeight;pop.style.left=Math.max(6,Math.min(innerWidth-w-6,x-w/2))+'px';pop.style.top=Math.max(6,Math.min(innerHeight-h-6,y-h-20))+'px'}
function hidePop(){pop.style.display='none'}
const avgY=ts=>(ts[0].clientY+ts[1].clientY)/2;
stage.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(pop.style.display==='grid'){hidePop();swallow=true;st=null;return}
  if(e.touches.length===1){swallow=false;
    const t=e.touches[0];st={x0:t.clientX,y0:t.clientY,moved:false,drag:false,long:false,two:false};
    st.timer=setTimeout(()=>{if(st&&!st.moved&&!st.two){st.long=true;navigator.vibrate&&navigator.vibrate(30);enq('/api/click',{...frac(t),button:'right'})}},550);
  }else if(e.touches.length===2&&st&&!st.drag){clearTimeout(st.timer);st.two=true;st.lastY=avgY(e.touches);st.acc=0;st.tot=0;st.t2=Date.now();st.cx=(e.touches[0].clientX+e.touches[1].clientX)/2}
},{passive:false});
stage.addEventListener('touchmove',e=>{
  e.preventDefault();if(!st)return;
  if(st.two&&e.touches.length>=2){const y=avgY(e.touches);st.tot+=Math.abs(y-st.lastY);st.acc+=y-st.lastY;st.lastY=y;const n=Math.trunc(st.acc/25);if(n){st.acc-=n*25;enq('/api/scroll',{wheel:n})}return}
  if(st.two||e.touches.length!==1)return;
  const t=e.touches[0];
  if(!st.drag&&!st.long&&Math.hypot(t.clientX-st.x0,t.clientY-st.y0)>10){
    st.moved=true;st.drag=true;clearTimeout(st.timer);enq('/api/down',frac({clientX:st.x0,clientY:st.y0}));
  }
  if(st.drag)move(frac(t));
},{passive:false});
stage.addEventListener('touchend',e=>{
  e.preventDefault();if(swallow){if(e.touches.length===0)swallow=false;return}if(!st)return;clearTimeout(st.timer);
  const t=e.changedTouches[0];
  if(st.two&&!st.popped&&st.tot<15&&Date.now()-st.t2<500){st.popped=true;showPop(st.cx,t.clientY)}
  if(st.drag){enq('/api/up',frac(t))}
  else if(!st.long&&!st.two&&!st.moved){enq('/api/click',{...frac(t),button:'left'})}
  if(e.touches.length===0)st=null;else st.moved=true;
},{passive:false});
stage.addEventListener('touchcancel',e=>{if(st&&st.drag)enq('/api/up',frac({clientX:st.x0,clientY:st.y0}));st=null});

// Touchpad: gerakan relatif (halus), tanpa menyentuh layar
let relPend=null;const GAIN=1.4;
function rel(dx,dy){if(relPend){relPend.dx+=dx;relPend.dy+=dy;return}const o=relPend={dx,dy};q=q.then(()=>{relPend=null;return api('/api/rel',{dx:Math.round(o.dx),dy:Math.round(o.dy)})})}
const pad=$('#pad');let pt=null,lastTap=0,dragLock=false;
pad.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0],now=Date.now();
    pt={x:t.clientX,y:t.clientY,t0:now,moved:0,two:false,acc:0,fx:0,fy:0,hold:false};
    if(now-lastTap<300){pt.hold=true}   // ketuk lalu langsung geser = drag
  }else if(e.touches.length===2&&pt){pt.two=true;pt.ly=avgY(e.touches);pt.tot=0;pt.t2=Date.now()}
},{passive:false});
pad.addEventListener('touchmove',e=>{
  e.preventDefault();if(!pt)return;
  if(pt.two&&e.touches.length>=2){const y=avgY(e.touches);pt.tot+=Math.abs(y-pt.ly);pt.acc+=y-pt.ly;pt.ly=y;const n=Math.trunc(pt.acc/20);if(n){pt.acc-=n*20;enq('/api/scroll',{wheel:n})}return}
  if(pt.two||e.touches.length!==1)return;
  const t=e.touches[0],dx=t.clientX-pt.x,dy=t.clientY-pt.y;pt.x=t.clientX;pt.y=t.clientY;pt.moved+=Math.abs(dx)+Math.abs(dy);
  if(pt.hold&&!pt.down&&pt.moved>4){pt.down=true;enq('/api/down',{})}
  pt.fx+=dx*GAIN;pt.fy+=dy*GAIN;const ix=Math.trunc(pt.fx),iy=Math.trunc(pt.fy);
  if(ix||iy){pt.fx-=ix;pt.fy-=iy;rel(ix,iy)}
},{passive:false});
pad.addEventListener('touchend',e=>{
  e.preventDefault();if(!pt)return;
  if(pt.two){if(!pt.rc&&pt.tot<12&&Date.now()-pt.t2<400){pt.rc=true;enq('/api/click',{button:'right'})}if(e.touches.length===0)pt=null;return}
  if(pt.down){enq('/api/up',{})}
  else if(pt.moved<8&&Date.now()-pt.t0<250){enq('/api/click',{button:'left'});lastTap=Date.now()}
  pt=null;
},{passive:false});
pad.addEventListener('touchcancel',e=>{if(pt&&pt.down)enq('/api/up',{});pt=null});
$('#pL').onclick=()=>enq('/api/click',{button:'left'});
$('#pR').onclick=()=>enq('/api/click',{button:'right'});
$('#pDrag').onclick=function(){dragLock=!dragLock;this.classList.toggle('on',dragLock);enq(dragLock?'/api/down':'/api/up',{})};
$('#bPad').onclick=function(){this.classList.toggle('on',$('#padwrap').classList.toggle('show'))};

// Modifier lengket + tombol
const mods={ctrl:false,alt:false,shift:false,super:false};
document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{const m=b.dataset.mod;mods[m]=!mods[m];b.classList.toggle('on',mods[m])});
function combo(k){const m=Object.keys(mods).filter(x=>mods[x]);Object.keys(mods).forEach(x=>mods[x]=false);document.querySelectorAll('[data-mod]').forEach(b=>b.classList.remove('on'));return[...m,k].join('+')}
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>enq('/api/key',{combo:combo(b.dataset.key)}));
document.querySelectorAll('[data-combo]').forEach(b=>b.onclick=()=>{enq('/api/key',{combo:b.dataset.combo});hidePop()});

// Keyboard HP -> laptop
const SENT='        ';function resetKb(){kb.value=SENT;kb.setSelectionRange(SENT.length,SENT.length)}
function sendText(s){
  if(!s)return;
  if(Object.values(mods).some(Boolean)){for(const c of s)enq('/api/key',{combo:combo(c==='+'?'+':c.toLowerCase())})}
  else enq('/api/type',{text:s});
}
$('#bKb').onclick=()=>{resetKb();kb.focus()};
kb.addEventListener('beforeinput',e=>{
  const t=e.inputType;if(t==='insertCompositionText')return;
  e.preventDefault();
  if(t==='insertText'||t==='insertFromPaste'||t==='insertReplacementText')sendText(e.data||'');
  else if(t==='deleteContentBackward')enq('/api/key',{combo:'backspace'});
  else if(t==='insertLineBreak'||t==='insertParagraph')enq('/api/key',{combo:combo('enter')});
});
kb.addEventListener('compositionend',e=>{sendText(e.data);resetKb()});
kb.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return;
  const map={Enter:'enter',Backspace:'backspace',Tab:'tab',Escape:'esc',ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Delete:'delete'};
  if(map[e.key]){e.preventDefault();enq('/api/key',{combo:combo(map[e.key])})}
});

// Clipboard
$('#bClip').onclick=()=>$('#clip').classList.toggle('show');
const ta=$('#cliptext');
$('#cPaste').onclick=()=>{enq('/api/clipset',{text:ta.value,paste:'ctrl+v'})};
$('#cPasteT').onclick=()=>{enq('/api/clipset',{text:ta.value,paste:'ctrl+shift+v'})};
$('#cSet').onclick=()=>{enq('/api/clipset',{text:ta.value});toast('Masuk clipboard laptop')};
$('#cGet').onclick=async()=>{try{const r=await fetch('/api/clip');const j=await r.json();if(!r.ok){toast(j.error);return}ta.value=j.text;toast(j.text?'Clipboard laptop diambil':'Clipboard laptop kosong')}catch(e){toast('Gagal mengambil')}};
$('#cCopy').onclick=async()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  if(!ok&&navigator.clipboard){try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){}}
  toast(ok?'Tersalin ke HP':'Gagal; tahan teks lalu pilih Salin')};

$('#pGet').onclick=()=>{hidePop();$('#clip').classList.add('show');$('#cGet').click()};
$('#pSend').onclick=()=>{hidePop();$('#clip').classList.add('show');ta.focus()};
fetch('/api/info').then(r=>r.json()).then(j=>{if(!j.control)toast('Kontrol nonaktif: '+j.message)}).catch(()=>{});
</script></body></html>
